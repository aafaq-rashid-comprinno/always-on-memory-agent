[project]
name = "always-on-memory-agent"
version = "1.0.0"
description = "Always-on AI memory agent using AWS Bedrock"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.scripts]
memory-agent = "src.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
